<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<title>Triage Medical — Clinical Assessment</title>

<!-- Telegram WebApp SDK -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<!-- html2pdf via CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Serif+Ethiopic:wght@400;700&display=swap" rel="stylesheet"/>

<style>
:root{
  --bg: #0c0e18;
  --text: #e4e8f5;
  --hint: #6b7db3;
  --blue: #1560d4;
  --blue-l: #1e88e5;
  --teal: #00b8d4;
  --green: #00c853;
  --red: #f44336;
  --glass: rgba(255,255,255,.05);
  --glass-b: rgba(255,255,255,.12);
  --r-md: 14px;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Inter',system-ui,sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  padding-bottom:110px;
}

#app{max-width:480px;margin:0 auto;padding:15px}

/* HEADER & STEPPER */
.hdr-brand{display:flex;align-items:center;gap:11px;margin-bottom:14px}
.hdr-icon{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,var(--blue),var(--teal));display:flex;align-items:center;justify-content:center;font-size:20px}
.hdr-title{font-size:16px;font-weight:800}
.hdr-sub{font-size:10px;color:var(--hint);text-transform:uppercase}

.stepper{display:flex;align-items:center;margin-bottom:20px}
.s-item{display:flex;flex-direction:column;align-items:center;flex:1}
.s-bub{width:28px;height:28px;border-radius:50%;border:2px solid var(--glass-b);background:var(--glass);color:var(--hint);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.s-item.active .s-bub{background:var(--blue);border-color:var(--blue-l);color:#fff}
.s-item.done .s-bub{background:var(--green);border-color:var(--green);color:#fff}
.s-lbl{font-size:8px;font-weight:700;text-transform:uppercase;color:var(--hint);margin-top:3px}

/* SCREENS */
.screen{display:none}
.screen.active{display:block}

/* CARDS & INPUTS */
.card{background:var(--glass);border:1px solid var(--glass-b);border-radius:var(--r-md);padding:16px;margin-bottom:14px}
.card-title{font-size:11px;font-weight:800;text-transform:uppercase;color:var(--blue-l);margin-bottom:12px}

.fg{margin-bottom:12px}
.lbl{display:block;font-size:11px;font-weight:600;color:var(--hint);margin-bottom:4px}
.inp,.sel{width:100%;background:rgba(255,255,255,.07);border:1px solid var(--glass-b);border-radius:8px;padding:10px;font-size:14px;color:var(--text);outline:none}
.sel option{background:#1a2035;color:var(--text)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* TOGGLES & LABS */
.sx-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sx-toggle input{display:none}
.sx-lbl{display:block;padding:10px;background:rgba(255,255,255,.04);border:1px solid var(--glass-b);border-radius:8px;font-size:12px;color:var(--hint);text-align:center;cursor:pointer}
.sx-toggle input:checked+.sx-lbl{background:rgba(21,96,212,.25);border-color:var(--blue-l);color:#fff;font-weight:700}

.lab-panel{background:rgba(0,200,83,.05);border:1px solid rgba(0,200,83,.3);border-radius:var(--r-md);padding:14px;margin-bottom:14px}
.lab-item{padding:6px 10px;background:rgba(255,255,255,.04);border-radius:6px;margin-bottom:4px;border-left:3px solid var(--green);font-size:12px}

/* BUTTONS */
.btn{display:flex;align-items:center;justify-content:center;width:100%;padding:12px;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer}
.btn-primary{background:linear-gradient(135deg,var(--blue),var(--blue-l));color:#fff}
.btn-sec{background:var(--glass);border:1px solid var(--glass-b);color:var(--text)}
.btn-pdf{background:linear-gradient(135deg,#880e4f,#e91e63);color:#fff;margin-bottom:8px}
.btn-tg{background:linear-gradient(135deg,#0077b5,#00aff0);color:#fff;margin-bottom:8px}

.nav-foot{position:fixed;bottom:0;left:0;right:0;z-index:200;padding:12px 18px;max-width:480px;margin:0 auto;background:var(--bg);display:flex;gap:10px}

/* PDF CONTAINER */
#pdf-wrap{position:fixed;top:0;left:-9999px;width:794px;z-index:-9999;opacity:0}
#pdf-wrap.rendering{opacity:1;left:0;top:0;z-index:-1}
#pdf-doc{width:794px;background:#fff;color:#111;font-family:sans-serif;padding:15mm}
.P-page{width:100%;min-height:1020px;box-sizing:border-box;position:relative;background:#fff}
.P-pagebreak{page-break-before:always;break-before:page}
.P-hdr{text-align:center;border-bottom:2px solid #0033aa;padding-bottom:8px;margin-bottom:12px}
.P-clinic{font-size:16pt;font-weight:900;color:#0033aa}
.P-amharic{font-family:'Noto Serif Ethiopic',serif;font-size:11pt;color:#0033aa}
.P-sec{margin-top:12px}
.P-seclbl{font-size:9pt;font-weight:800;color:#0033aa;border-left:3px solid #0033aa;padding-left:6px;margin-bottom:6px;text-transform:uppercase}
.P-tbl{width:100%;border-collapse:collapse;font-size:8.5pt}
.P-tbl td{padding:5px 8px;border:1px solid #d0d5e8}
.P-tbl td:first-child{font-weight:700;background:#f0f4ff;width:35%}
.P-lab-card{border:1px solid #c5d2f0;border-radius:6px;padding:10px;margin-bottom:8px;background:#f8fafe;font-size:9pt}
.P-stamp-area{margin-top:40px;display:flex;justify-content:space-between;align-items:flex-end}
.P-sigblock{text-align:center;width:200px;position:relative}
.P-sigline{border-top:1px solid #333;margin-top:35px;margin-bottom:3px}
.P-foot{position:absolute;bottom:5mm;left:0;right:0;text-align:center;font-size:7.5pt;color:#aaa}
</style>
</head>
<body>

<div id="pdf-wrap"><div id="pdf-doc"></div></div>

<div id="app">

  <div class="hdr-brand">
    <div class="hdr-icon">🏥</div>
    <div>
      <div class="hdr-title">Triage Medical Consultancy</div>
      <div class="hdr-sub">ትሪያጅ ሜዲካል ኮንሰልተንሲ</div>
    </div>
  </div>

  <nav class="stepper">
    <div class="s-item active" id="si-1"><div class="s-bub">1</div><span class="s-lbl">Patient</span></div>
    <div class="s-item" id="si-2"><div class="s-bub">2</div><span class="s-lbl">Vitals</span></div>
    <div class="s-item" id="si-3"><div class="s-bub">3</div><span class="s-lbl">Sx Pt1</span></div>
    <div class="s-item" id="si-4"><div class="s-bub">4</div><span class="s-lbl">Sx Pt2</span></div>
    <div class="s-item" id="si-5"><div class="s-bub">✦</div><span class="s-lbl">Report</span></div>
  </nav>

  <!-- SCREEN 1 -->
  <section class="screen active" id="scr-1">
    <div class="card">
      <div class="card-title">Patient Information</div>
      <div class="fg">
        <label class="lbl">Full Name</label>
        <input class="inp" id="fullName" type="text" placeholder="e.g. Abebe Tadesse" value="Abebe Tadesse"/>
      </div>
      <div class="row2">
        <div class="fg">
          <label class="lbl">Age</label>
          <input class="inp" id="age" type="number" placeholder="Years" value="35"/>
        </div>
        <div class="fg">
          <label class="lbl">Biological Sex</label>
          <select class="sel" id="sex">
            <option>Male</option><option>Female</option>
          </select>
        </div>
      </div>
      <div class="fg">
        <label class="lbl">Chief Complaint</label>
        <input class="inp" id="chiefComplaint" type="text" placeholder="Primary complaint" value="Chest Pain and Dyspnea"/>
      </div>
      <div class="row2">
        <div class="fg">
          <label class="lbl">Duration</label>
          <input class="inp" id="durVal" type="number" value="2"/>
        </div>
        <div class="fg">
          <label class="lbl">Unit</label>
          <select class="sel" id="durUnit">
            <option value="days">Days</option>
            <option value="hours">Hours</option>
          </select>
        </div>
      </div>
    </div>
  </section>

  <!-- SCREEN 2 -->
  <section class="screen" id="scr-2">
    <div class="card">
      <div class="card-title">Vital Signs</div>
      <div class="row2">
        <div class="fg"><label class="lbl">SpO₂ (%)</label><input class="inp" id="spo2" type="number" value="96"/></div>
        <div class="fg"><label class="lbl">Pulse (bpm)</label><input class="inp" id="pulse" type="number" value="82"/></div>
        <div class="fg"><label class="lbl">Temp (°C)</label><input class="inp" id="temp" type="number" value="37.1"/></div>
        <div class="fg"><label class="lbl">BP (Systolic)</label><input class="inp" id="bpS" type="number" value="130"/></div>
      </div>
    </div>
  </section>

  <!-- SCREEN 3 -->
  <section class="screen" id="scr-3">
    <div class="card">
      <div class="card-title">🫁 Respiratory & Cardiac</div>
      <div class="sx-grid">
        <label class="sx-toggle"><input type="checkbox" id="sx-sob" checked/><span class="sx-lbl">Shortness of Breath</span></label>
        <label class="sx-toggle"><input type="checkbox" id="sx-cough"/><span class="sx-lbl">Cough</span></label>
        <label class="sx-toggle"><input type="checkbox" id="sx-cp" checked/><span class="sx-lbl">Chest Pain</span></label>
        <label class="sx-toggle"><input type="checkbox" id="sx-fever"/><span class="sx-lbl">Fever</span></label>
      </div>
    </div>
  </section>

  <!-- SCREEN 4 -->
  <section class="screen" id="scr-4">
    <div class="card">
      <div class="card-title">🧠 Neuro & GI</div>
      <div class="sx-grid">
        <label class="sx-toggle"><input type="checkbox" id="sx-headache"/><span class="sx-lbl">Headache</span></label>
        <label class="sx-toggle"><input type="checkbox" id="sx-abdo-pain"/><span class="sx-lbl">Abdominal Pain</span></label>
        <label class="sx-toggle"><input type="checkbox" id="sx-dysuria"/><span class="sx-lbl">Dysuria</span></label>
      </div>
    </div>
    <div class="lab-panel">
      <div class="card-title" style="color:var(--green)">Auto-Generated Lab Orders</div>
      <div id="lab-content"></div>
    </div>
  </section>

  <!-- SCREEN 5 -->
  <section class="screen" id="scr-5">
    <div class="card">
      <div class="card-title">Triage Summary</div>
      <div id="summary-details"></div>
    </div>

    <button class="btn btn-pdf" onclick="generatePDF()">📄 Download Official Triage PDF</button>
    <button class="btn btn-tg" onclick="submitToTelegram()">✈️ Submit to Telegram</button>
    <button class="btn btn-sec" onclick="restartApp()">🔄 New Assessment</button>
  </section>

</div>

<div class="nav-foot" id="nav-foot">
  <button class="btn btn-sec" id="btn-back" onclick="navBack()" style="display:none;max-width:100px">← Back</button>
  <button class="btn btn-primary" id="btn-next" onclick="navNext()">Continue →</button>
</div>

<script>
let step = 1;
const STEPS = 5;

function navNext(){
  if(step < STEPS){
    document.getElementById(`scr-${step}`).classList.remove('active');
    document.getElementById(`si-${step}`).classList.remove('active');
    document.getElementById(`si-${step}`).classList.add('done');
    
    step++;
    
    document.getElementById(`scr-${step}`).classList.add('active');
    document.getElementById(`si-${step}`).classList.add('active');
    
    document.getElementById('btn-back').style.display = 'flex';
    if(step === STEPS){
      document.getElementById('nav-foot').style.display = 'none';
      renderReport();
    } else {
      document.getElementById('btn-next').textContent = step === STEPS - 1 ? 'Generate Report →' : 'Continue →';
    }
    updateLabs();
  }
}

function navBack(){
  if(step > 1){
    document.getElementById(`scr-${step}`).classList.remove('active');
    document.getElementById(`si-${step}`).classList.remove('active');
    
    step--;
    
    document.getElementById(`scr-${step}`).classList.add('active');
    document.getElementById(`si-${step}`).classList.add('active');
    
    if(step === 1) document.getElementById('btn-back').style.display = 'none';
    document.getElementById('btn-next').textContent = 'Continue →';
  }
}

function updateLabs(){
  const labs = [];
  if(document.getElementById('sx-cp').checked) labs.push('12-Lead ECG (Cardiology)', 'Troponin I/T (Biochemistry)');
  if(document.getElementById('sx-sob').checked) labs.push('Chest X-Ray PA (Radiology)', 'Arterial Blood Gas (Critical Care)');
  if(document.getElementById('sx-fever').checked) labs.push('Complete Blood Count (Haematology)');

  const lc = document.getElementById('lab-content');
  if(labs.length === 0){
    lc.innerHTML = '<div style="font-size:12px;color:var(--hint)">No lab tests triggered.</div>';
  } else {
    lc.innerHTML = labs.map(l => `<div class="lab-item">🧪 <strong>${l}</strong></div>`).join('');
  }
}

function renderReport(){
  const name = document.getElementById('fullName').value || 'Patient';
  const age = document.getElementById('age').value || '35';
  const sex = document.getElementById('sex').value;
  const cc = document.getElementById('chiefComplaint').value || 'None';

  document.getElementById('summary-details').innerHTML = `
    <p style="margin-bottom:6px"><strong>Patient:</strong> ${name} (${age} yrs, ${sex})</p>
    <p style="margin-bottom:6px"><strong>Complaint:</strong> ${cc}</p>
    <p style="margin-bottom:6px"><strong>SpO₂:</strong> ${document.getElementById('spo2').value}% | <strong>BP:</strong> ${document.getElementById('bpS').value} mmHg</p>
  `;
}

function buildPDFHTML(){
  const name = document.getElementById('fullName').value || 'Patient';
  const age = document.getElementById('age').value || '35';
  const sex = document.getElementById('sex').value;
  const cc = document.getElementById('chiefComplaint').value || 'None';

  const stamp = `<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" style="width:120px;height:120px">
    <circle cx="100" cy="100" r="95" fill="none" stroke="#002288" stroke-width="3"/>
    <circle cx="100" cy="100" r="85" fill="none" stroke="#002288" stroke-width="1"/>
    <defs><path id="tA" d="M 20,100 A 80,80 0 0,1 180,100"/><path id="bA" d="M 20,100 A 80,80 0 0,0 180,100"/></defs>
    <text font-size="9" font-weight="800" fill="#002288"><textPath href="#tA" startOffset="5%">TRIAGE MEDICAL CONSULTANCY</textPath></text>
    <text font-size="8" font-weight="700" fill="#002288"><textPath href="#bA" startOffset="5%">ትሪያጅ ሜዲካል ኮንሰልተንሲ</textPath></text>
    <rect x="94" y="70" width="12" height="36" fill="#002288"/><rect x="82" y="82" width="36" height="12" fill="#002288"/>
  </svg>`;

  const sig = `<svg viewBox="0 0 300 400" xmlns="http://www.w3.org/2000/svg" style="width:100px;height:100px;position:absolute;top:-50px;left:40px">
    <path d="M 120 20 C 60 40 30 110 30 180 C 30 250 80 310 90 380 C 95 400 70 380 60 350 C 40 280 130 100 190 20" fill="none" stroke="#000033" stroke-width="10"/>
  </svg>`;

  return `
  <div class="P-page">
    <div class="P-hdr">
      <div class="P-clinic">Triage Medical Consultancy</div>
      <div class="P-amharic">ትሪያጅ ሜዲካል ኮንሰልተንሲ</div>
      <div class="P-seclbl" style="margin-top:6px">Clinical Assessment & Triage Summary</div>
    </div>
    <div class="P-sec">
      <div class="P-seclbl">Patient Details</div>
      <table class="P-tbl">
        <tr><td>Full Name</td><td>${name}</td><td>Age / Sex</td><td>${age} / ${sex}</td></tr>
        <tr><td>Complaint</td><td colspan="3">${cc}</td></tr>
      </table>
    </div>
    <div class="P-foot">Page 1 of 2 — Summary Sheet</div>
  </div>

  <div class="P-page P-pagebreak">
    <div class="P-hdr">
      <div class="P-clinic">Triage Medical Consultancy</div>
      <div class="P-amharic">ትሪያጅ ሜዲካል ኮንሰልተንሲ</div>
      <div class="P-seclbl" style="margin-top:6px">Official Diagnostic Requisition</div>
    </div>
    <div class="P-sec">
      <div class="P-seclbl">Laboratory Requisitions</div>
      <div class="P-lab-card">
        • 12-Lead ECG (Cardiology)<br>
        • High-Sensitivity Troponin I/T (Biochemistry)<br>
        • Chest X-Ray PA View (Radiology)
      </div>
    </div>
    <div class="P-stamp-area">
      <div class="P-sigblock">
        ${sig}
        <div class="P-sigline"></div>
        <div>Attending Clinician Signature</div>
      </div>
      <div>${stamp}</div>
    </div>
    <div class="P-foot">Page 2 of 2 — Diagnostic Requisition Sheet</div>
  </div>`;
}

async function generatePDF(){
  const wrap = document.getElementById('pdf-wrap');
  const doc = document.getElementById('pdf-doc');
  doc.innerHTML = buildPDFHTML();
  wrap.classList.add('rendering');

  const opt = {
    margin: [0,0,0,0],
    filename: 'Triage_Medical_Report.pdf',
    image: { type: 'jpeg', quality: 0.98 },
    html2canvas: { scale: 2, useCORS: true, width: 794 },
    jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
    pagebreak: { mode: ['css', 'legacy'] }
  };

  try{
    await html2pdf().set(opt).from(doc).save();
  }catch(e){
    alert('Error generating PDF: ' + e.message);
  }finally{
    wrap.classList.remove('rendering');
    doc.innerHTML = '';
  }
}

function submitToTelegram(){
  const TG = window.Telegram?.WebApp;
  if(TG?.sendData){
    TG.sendData(JSON.stringify({ status: "submitted" }));
    alert('Submitted to Telegram!');
  } else {
    alert('Please open inside Telegram to submit data.');
  }
}

function restartApp(){
  location.reload();
}
</script>
</body>
</html>
